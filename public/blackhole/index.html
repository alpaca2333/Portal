<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 黑洞模拟</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            z-index: 100;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: inline-block;
            width: 120px;
            font-size: 14px;
        }
        input[type="range"] {
            vertical-align: middle;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <a href="/" class="back-btn">返回门户</a>
    <div id="loading">加载中...</div>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <div class="control-group">
            <label for="mass">黑洞质量:</label>
            <input type="range" id="mass" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label for="diskDensity">吸积盘密度:</label>
            <input type="range" id="diskDensity" min="0.0" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label for="doppler">多普勒效应:</label>
            <input type="range" id="doppler" min="0.0" max="1.0" step="0.1" value="1.0">
        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
